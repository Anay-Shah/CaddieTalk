name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,infra]"

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Test
        run: pytest

# Note: no job here calls Bedrock or any other paid AWS service. The caddie eval set
# (M6) is run manually on purpose — see DECISIONS.md D-005.
