# Default bag used before a player has logged enough shots to fit their own numbers.
#
# These are plausible totals (carry plus roll) for a mid-handicap amateur, in YARDS for
# readability. The engine converts to metres on load.
#
# M3 replaces these with per-club values fitted from real logged shots, blended with
# these as a prior. Until then every recommendation is built on this bag, so treat any
# absolute yardage from the engine as provisional.
#
# sd_pct     — spread in distance, as a fraction of the mean. ~5% is typical.
# lateral_sd_pct — left/right spread, as a fraction of the mean. Rises for longer clubs.
# bias_pct   — systematic miss. Positive is right. Overridden per player once fitted.

reference_handicap: 15

defaults:
  sd_pct: 0.05
  lateral_sd_pct: 0.07
  bias_pct: 0.0

clubs:
  - { name: "Dr", mean_yds: 210, lateral_sd_pct: 0.085 }
  - { name: "3w", mean_yds: 190, lateral_sd_pct: 0.080 }
  - { name: "5w", mean_yds: 175, lateral_sd_pct: 0.075 }
  - { name: "4i", mean_yds: 165 }
  - { name: "5i", mean_yds: 155 }
  - { name: "6i", mean_yds: 145 }
  - { name: "7i", mean_yds: 135 }
  - { name: "8i", mean_yds: 125 }
  - { name: "9i", mean_yds: 113 }
  - { name: "PW", mean_yds: 100, lateral_sd_pct: 0.060 }
  - { name: "GW", mean_yds: 85, lateral_sd_pct: 0.055 }
  - { name: "SW", mean_yds: 70, lateral_sd_pct: 0.050 }
  - { name: "LW", mean_yds: 55, lateral_sd_pct: 0.050 }
